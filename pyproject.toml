[project]
name = "uk-tenders-mcp"
version = "0.2.0"
description = "Read-only MCP tools over UK public tenders (Find a Tender and Contracts Finder) and Companies House, with explainable bid scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmed Osman" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uk-tenders-mcp = "uk_tenders_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_tenders_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
